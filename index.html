        header {

        .close-admin {

        .form-group {

        .form-group input, .form-group textarea {

        .form-group input:focus, .form-group textarea:focus {

        .form-group textarea {

        }



        button.primary-btn {

            background: var(--accent);

            color: white;

            border: none;

            padding: 12px 24px;

            font-size: 1rem;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

            transition: background 0.3s;

        button.primary-btn:hover {

            background: var(--accent-hover);

        .news-feed h2 {

        /* Advertica Ad Container (Top) */

            border: 1px solid var(--card-border);

            padding: 15px;

        }



        /* Sticky Bottom Adsterra Banner */

        .sticky-bottom-ad {

            position: fixed;

            bottom: 0;

            left: 0;

            width: 100%;

            background: rgba(15, 23, 42, 0.95);

            backdrop-filter: blur(12px);

            border-top: 1px solid rgba(129, 140, 248, 0.3);

            padding: 12px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);

        .sticky-ad-content {

            display: flex;

            align-items: center;

        }



        .sticky-ad-content span {

        }



        .sticky-ad-text h4 {

            margin: 0;

        }



        .sticky-ad-text p {

        .sticky-cta-btn {

            background: linear-gradient(135deg, #6366f1, #a855f7);

            color: white;

            text-decoration: none;

            padding: 8px 18px;

            border-radius: 6px;

            font-weight: 600;

            font-size: 0.85rem;

            transition: opacity 0.3s, transform 0.2s;

            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);

            white-space: nowrap;

        }



        .sticky-cta-btn:hover {

            opacity: 0.9;

            transform: scale(1.02);

        }



        .news-card {

            background: var(--card-bg);

            border: 1px solid var(--card-border);

            backdrop-filter: blur(8px);

            padding: 25px;

            border-radius: 16px;

            margin-bottom: 20px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.2);

            transition: transform 0.3s ease;

        }



        .news-card:hover {

            transform: translateY(-3px);

        }



        .news-card h3 {

            margin-top: 0;

            font-size: 1.5rem;

            color: var(--text-main);

        .news-date {

            font-size: 0.85rem;

            color: var(--text-muted);

            margin-bottom: 15px;

            line-height: 1.7;

        .delete-btn {

            background: rgba(239, 68, 68, 0.15);

            font-size: 0.85rem;

            border-radius: 6px;

            cursor: pointer;

            margin-top: 20px;

        }



        .delete-btn.admin-visible {

            display: inline-block;

        .delete-btn:hover {

        .loading-text, .empty-text {

            color: var(--text-muted);

        @keyframes fadeIn {

            from { opacity: 0; transform: translateY(10px); }

            to { opacity: 1; transform: translateY(0); }

<body>



    <header>

        <h1>Chronicle 24/7</h1>

        <p>Your Live Global News Stream</p>

    </header>



    <div class="container">

        

        <div class="top-action-bar">

            <button class="login-trigger-btn" id="toggleLoginBtn" onclick="handleAdminAccess()">🔒 Admin Portal</button>

        </div>



        <div class="admin-panel" id="adminPanel">

            <h2>

                <span>📢 Publish New Article</span>

                <button class="close-admin" onclick="closeAdminPanel()">✕</button>

            </h2>

            <form id="newsForm">

                <div class="form-group">

                    <label for="title">Headline</label>

                    <input type="text" id="title" required placeholder="Catchy news headline...">

                </div>

                <div class="form-group">

                    <label for="content">Full Story</label>

                    <textarea id="content" required placeholder="Write the complete news report here..."></textarea>

                </div>

                <button type="submit" class="primary-btn" id="publishBtn">Publish to Cloud</button>

            </form>

        </div>



        <div class="news-feed">

            <h2>Live Feed</h2>

            

            <div class="ad-container">

                <ins style="display:inline-block; width: 300px; height: 250px;" data-width="300" data-height="250" class="c3ed5df49a0" data-domain="//data527.click" data-affquery="/5d980c1bb9e9ce6fa349/3ed5df49a0/?placementName=advertica"></ins>

                <script src="//data527.click/js/responsive.js" async></script>

            </div>



            <div id="newsContainer">

                <div class="loading-text">Connecting to live feed...</div>

            </div>

        </div>



    </div>



    <div class="sticky-bottom-ad">

        <div class="sticky-ad-content">

            <span>🔴</span>

            <div class="sticky-ad-text">

                <h4>Special Live Stream Feed</h4>

                <p>Click to access unrestricted live global broadcasts.</p>

            </div>

        </div>

        <a href="https://www.profitableratecpmnetwork.com/fcsxqmrtf?key=77785123756f4a00c1f2d566da9c0500" target="_blank" class="sticky-cta-btn">Watch Now</a>

    </div>



    <script>

        // --- SUPABASE CONFIGURATION ---

        const SUPABASE_URL = 'https://lxktfhinbdchhqgoutke.supabase.co';

        const SUPABASE_ANON_KEY = 'sb_publishable_dABXCMeRrnUbouX9-AlYhw_ZEzDnJ7_';



        const { createClient } = supabase;

        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);



        const newsForm = document.getElementById('newsForm');

        const newsContainer = document.getElementById('newsContainer');

        const publishBtn = document.getElementById('publishBtn');

        const adminPanel = document.getElementById('adminPanel');



        let isAdminLoggedIn = false;



        // Admin Security System (Password: admin123)

        window.handleAdminAccess = function() {

            if (isAdminLoggedIn) {

                adminPanel.classList.toggle('active');

                return;

            }



            const password = prompt("Enter Admin Secret Password:");

            if (password === "admin123") {

                isAdminLoggedIn = true;

                adminPanel.classList.add('active');

                document.getElementById('toggleLoginBtn').textContent = "🔓 Admin Panel Open";

                fetchNews(); // Refresh to show delete buttons

                alert("Login Successful!");

            } else if (password !== null) {

                alert("Incorrect Password!");

            }

        };



        window.closeAdminPanel = function() {

            adminPanel.classList.remove('active');

        };



        // Fetch and Display News from Supabase

        async function fetchNews() {

            const { data, error } = await _supabase

                .from('news')

                .select('*')

                .order('created_at', { ascending: false });



            if (error) {

                console.error('Error fetching news:', error);

                newsContainer.innerHTML = '<div class="empty-text">Failed to load news.</div>';

                return;

            }



            newsContainer.innerHTML = '';



            if (!data || data.length === 0) {

                newsContainer.innerHTML = '<div class="empty-text">No active news broadcasts right now.</div>';

                return;

            }



            data.forEach((news) => {

                let dateStr = new Date(news.created_at).toLocaleString('en-US', { 

                    month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' 

                });



                const card = document.createElement('div');

                card.className = 'news-card';

                

                const deleteBtnClass = isAdminLoggedIn ? "delete-btn admin-visible" : "delete-btn";



                card.innerHTML = `

                    <h3>${escapeHtml(news.title)}</h3>

                    <div class="news-date">${dateStr}</div>

                    <div class="news-content">${escapeHtml(news.content)}</div>

                    <button class="${deleteBtnClass}" onclick="deleteNewsItem(${news.id})">Delete Article</button>

                `;

                newsContainer.appendChild(card);

            });

        }



        // Publish News to Supabase

        newsForm.addEventListener('submit', async function(e) {

            e.preventDefault();

            if (!isAdminLoggedIn) return;



            publishBtn.disabled = true;

            publishBtn.textContent = "Publishing...";



            const title = document.getElementById('title').value;

            const content = document.getElementById('content').value;



            const { error } = await _supabase

                .from('news')

                .insert([{ title, content }]);



            publishBtn.disabled = false;

            publishBtn.textContent = "Publish to Cloud";



            if (error) {

                alert("Error publishing news: " + error.message);

            } else {

                newsForm.reset();

                adminPanel.classList.remove('active');

                fetchNews();

            }

        });



        // Delete News Item

        window.deleteNewsItem = async function(id) {

            if (!isAdminLoggedIn) return;

            if (confirm("Are you sure you want to delete this news?")) {

                const { error } = await _supabase

                    .from('news')

                    .delete()

                    .eq('id', id);



                if (error) {

                    alert("Error deleting news: " + error.message);

                } else {

                    fetchNews();

                }

            }

        };



        function escapeHtml(text) {

            if (!text) return '';

            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };

            return text.toString().replace(/[&<>"']/g, function(m) { return map[m]; });

        }



        // Load news when page opens

        fetchNews();

    </script>

</body>
