<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle 24/7 - Live Global News</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        header p {
            margin: 10px 0 0;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .top-action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .login-trigger-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .login-trigger-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .admin-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 40px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h2 {
            margin-top: 0;
            color: #818cf8;
            font-size: 1.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-admin {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent);
        }

        .form-group textarea {
            resize: vertical;
            height: 120px;
        }

        button.primary-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        button.primary-btn:hover {
            background: var(--accent-hover);
        }

        .news-feed h2 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
        }

        /* Ad Containers / Positions */
        .ad-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
        }

        /* Sticky Bottom Adsterra Banner (Position 5) */
        .sticky-bottom-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(129, 140, 248, 0.3);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            z-index: 999;
            box-sizing: border-box;
        }

        .sticky-ad-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sticky-ad-content span {
            font-size: 1.1rem;
        }

        .sticky-ad-text h4 {
            margin: 0;
            font-size: 0.95rem;
            color: #c084fc;
        }

        .sticky-ad-text p {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .sticky-cta-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: opacity 0.3s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            white-space: nowrap;
        }

        .sticky-cta-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(8px);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .news-card:hover {
            transform: translateY(-3px);
        }

        .news-card h3 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        .news-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .news-content {
            line-height: 1.7;
            color: #cbd5e1;
            white-space: pre-wrap;
            font-size: 1.05rem;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            display: none;
        }

        .delete-btn.admin-visible {
            display: inline-block;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        .loading-text, .empty-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 40px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Chronicle 24/7</h1>
        <p>Your Live Global News Stream</p>
    </header>

    <div class="container">
        
        <div class="top-action-bar">
            <button class="login-trigger-btn" id="toggleLoginBtn" onclick="handleAdminAccess()">🔒 Admin Portal</button>
        </div>

        <div class="admin-panel" id="adminPanel">
            <h2>
                <span>📢 Publish New Article</span>
                <button class="close-admin" onclick="closeAdminPanel()">✕</button>
            </h2>
            <form id="newsForm">
                <div class="form-group">
                    <label for="title">Headline</label>
                    <input type="text" id="title" required placeholder="Catchy news headline...">
                </div>
                <div class="form-group">
                    <label for="content">Full Story</label>
                    <textarea id="content" required placeholder="Write the complete news report here..."></textarea>
                </div>
                <button type="submit" class="primary-btn" id="publishBtn">Publish to Cloud</button>
            </form>
        </div>

        <div class="news-feed">
            <h2>Live Feed</h2>
